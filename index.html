<script>
  (() => {
    const hamburger = document.querySelector('.hamburger');
    const nav = document.querySelector('nav');
    const body = document.body;
    if (!hamburger || !nav) return;

    const ensureOverlay = () => {
      let overlay = document.querySelector('.nav-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'nav-overlay';
        document.body.appendChild(overlay);
      }
      return overlay;
    };

    const overlay = ensureOverlay();

    const closeNav = () => {
      nav.classList.remove('active');
      body.classList.remove('nav-open');
      overlay.classList.remove('show');
    };

    hamburger.addEventListener('click', () => {
      const willOpen = !nav.classList.contains('active');
      nav.classList.toggle('active', willOpen);
      body.classList.toggle('nav-open', willOpen);
      overlay.classList.toggle('show', willOpen);
    });

    overlay.addEventListener('click', closeNav);
  })();

  // 由щ럭 濡ㅻ쭅 (2珥덈쭏???ㅼ쓬 由щ럭)
  const reviewItems = document.querySelectorAll('.hero-reviews .review-item');
  const reviewIcon = document.querySelector('.hero-reviews .review-icon');
  let reviewIndex = 0;
  const setReview = (next) => {
    reviewItems[reviewIndex].classList.remove('active');
    reviewIndex = next;
    reviewItems[reviewIndex].classList.add('active');
    const rating = reviewItems[reviewIndex].dataset.rating || '5.0';
    reviewIcon.textContent = `??${rating}`;
  };
  setInterval(() => {
    setReview((reviewIndex + 1) % reviewItems.length);
  }, 2600);
  setReview(0);
</script>
